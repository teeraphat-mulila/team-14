<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

</head>
<body>

  <!-- รอบที่ 3 (คาบหน้า): แก้ชื่อทีมตรงบรรทัดนี้ -->
  <h1 id="team-name">albert and Einstein</h1>

  <!-- ===== รอบที่ 1: ทุกคนผลัดกันเพิ่มชื่อเล่นของตัวเอง ===== -->
  <h2>สมาชิก</h2>
  <ul id="member-list">
    <li>คนที่ 1: Teeraphat Mulila</li>
    <li>คนที่ 2: Teechaya Kaewmaruan</li>
    <li>คนที่ 3: Dan Wongchai Saensuwong</li>
  </ul>

  <!-- ===== รอบที่ 2: คนที่ 1 (หัวหน้าทีม) ทำการ์ดให้ครบ 3 ใบ ===== -->
  <h2>รู้จักพวกเรา</h2>

    <!-- การ์ดตัวอย่าง: คัดลอกทั้งก้อนนี้ไปทำใบที่ 2 และ 3 -->

      <h3 class="card-name">Geeno</h3>
      <p class="card-role">write html</p>
      <p class="card-hobby">playing games</p>
    </div>

    <!-- การ์ดคนที่ 2 วางตรงนี้ -->
     <div class="card">
      <h3 class="card-name">Dan</h3>
      <p class="card-role">write javascript</p>
      <p class="card-hobby">goon</p>
    </div>
    <!-- การ์ดคนที่ 3 วางตรงนี้ -->
     <div class="card">
      <h3 class="card-name">Kwankao</h3>
      <p class="card-role">write Css</p>
      <p class="card-hobby">draw a picture</p>
    </div>
  </div>

  <!-- ปุ่มสำหรับคนที่ 3 (โปรแกรมเมอร์) ห้ามลบ id -->
  <button id="hello-btn">ทักทาย</button>
  <button id="theme-btn">สลับโหมดมืด</button>
